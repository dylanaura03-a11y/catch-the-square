```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catch The Square</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#080014,#16002d,#05000c);
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

header{
    padding:18px;
    text-align:center;
    background:#10001f;
    border-bottom:2px solid #7c3cff;
    box-shadow:0 0 25px #7c3cff55;
}

header h1{
    margin:0;
    font-size:32px;
}

header p{
    margin:6px 0 0;
    color:#bfa8ff;
}

.stats{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    padding:15px;
}

.stat{
    background:#16052a;
    border:1px solid #713cff;
    border-radius:14px;
    padding:12px 20px;
    min-width:110px;
    text-align:center;
    box-shadow:0 0 15px #6d35ff33;
}

.stat b{
    display:block;
    font-size:22px;
    margin-top:4px;
}

#game{
    width:min(92vw,700px);
    height:430px;
    margin:15px auto;
    position:relative;
    background:
        radial-gradient(circle at center,#241044,#0a0013);
    border:2px solid #7c3cff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 0 35px #7c3cff55;
}

#square{
    width:55px;
    height:55px;
    position:absolute;
    border:0;
    border-radius:12px;
    cursor:pointer;
    background:linear-gradient(135deg,#a855f7,#5b21b6);
    box-shadow:0 0 25px #a855f7;
    transition:transform .08s;
}

#square:active{
    transform:scale(.85);
}

.panel{
    width:min(92vw,700px);
    margin:20px auto;
    background:#11001f;
    border:1px solid #743cff;
    border-radius:20px;
    padding:20px;
    box-shadow:0 0 30px #6d35ff33;
}

.panel h2{
    margin-top:0;
}

button,
input{
    font:inherit;
}

.menuBtn{
    width:100%;
    margin:7px 0;
    padding:13px;
    border:1px solid #8b5cf6;
    border-radius:12px;
    background:#1b0733;
    color:white;
    cursor:pointer;
}

.menuBtn:hover{
    background:#2b0a4d;
}

.admin{
    display:none;
    margin-top:15px;
    padding-top:15px;
    border-top:1px solid #41205f;
}

.admin input{
    width:100%;
    padding:12px;
    margin:6px 0;
    border-radius:10px;
    border:1px solid #7042c8;
    background:#08000e;
    color:white;
}

.message{
    margin-top:10px;
    padding:10px;
    border-radius:10px;
    background:#090012;
    color:#cdb8ff;
    min-height:20px;
}

footer{
    text-align:center;
    padding:25px;
    color:#8f7aa8;
}
</style>
</head>

<body>

<header>
    <h1>⚡ CATCH THE SQUARE ⚡</h1>
    <p>Dylan Panel Edition</p>
</header>

<div class="stats">
    <div class="stat">🏆 Score<b id="score">0</b></div>
    <div class="stat">🪙 Coins<b id="coins">0</b></div>
    <div class="stat">🔥 Level<b id="level">1</b></div>
    <div class="stat">❤️ Lives<b id="lives">3</b></div>
</div>

<div id="game">
    <button id="square" aria-label="Catch the square"></button>
</div>

<div class="panel">
    <h2>👑 DYLAN PANEL</h2>

    <button class="menuBtn" onclick="dailyReward()">
        🎁 Daily Reward
    </button>

    <button class="menuBtn" onclick="shop()">
        🛒 Shop
    </button>

    <button class="menuBtn" onclick="missions()">
        🎯 Missions
    </button>

    <button class="menuBtn" onclick="toggleAdmin()">
        🔐 Admin Panel
    </button>

    <div id="admin" class="admin">
        <h3>⚡ Dylan Admin Controls</h3>

        <input id="adminKey" type="password"
               placeholder="Enter admin key">

        <button class="menuBtn" onclick="unlockAdmin()">
            🔓 Unlock
        </button>

        <div id="adminControls" style="display:none">

            <input id="targetPlayer"
                   placeholder="Player UID">

            <input id="coinAmount"
                   type="number"
                   placeholder="Coins">

            <button class="menuBtn" onclick="giveCoins()">
                🪙 Give Coins
            </button>

            <button class="menuBtn" onclick="addCoinsSelf()">
                💰 Give Myself 1,000 Coins
            </button>

            <button class="menuBtn" onclick="resetGame()">
                🔄 Reset My Game
            </button>

        </div>

        <div id="adminMessage" class="message"></div>
    </div>

    <div id="message" class="message">
        Catch the square! 👀
    </div>
</div>

<footer>
    © 2026 Catch The Square • Made by Dylan ⚡
</footer>

<script>
let score = Number(localStorage.getItem("score")) || 0;
let coins = Number(localStorage.getItem("coins")) || 0;
let level = Number(localStorage.getItem("level")) || 1;
let lives = Number(localStorage.getItem("lives")) || 3;

const square = document.getElementById("square");

function save(){
    localStorage.setItem("score",score);
    localStorage.setItem("coins",coins);
    localStorage.setItem("level",level);
    localStorage.setItem("lives",lives);
}

function update(){
    document.getElementById("score").textContent=score;
    document.getElementById("coins").textContent=coins;
    document.getElementById("level").textContent=level;
    document.getElementById("lives").textContent=lives;
    save();
}

function moveSquare(){
    const game=document.getElementById("game");

    const maxX=game.clientWidth-square.offsetWidth;
    const maxY=game.clientHeight-square.offsetHeight;

    const x=Math.random()*maxX;
    const y=Math.random()*maxY;

    square.style.left=x+"px";
    square.style.top=y+"px";
}

square.addEventListener("click",function(){

    score++;
    coins+=2;

    if(score % 10 === 0){
        level++;
        coins+=10;

        document.getElementById("message").textContent =
            "🔥 LEVEL UP! +10 bonus coins!";
    }else{
        document.getElementById("message").textContent =
            "⚡ Nice catch! +2 coins";
    }

    update();
    moveSquare();
});

function dailyReward(){

    const today=new Date().toDateString();
    const last=localStorage.getItem("dailyReward");

    if(last===today){
        document.getElementById("message").textContent =
            "⏰ You already claimed today's reward!";
        return;
    }

    coins+=100;
    localStorage.setItem("dailyReward",today);

    document.getElementById("message").textContent =
        "🎁 DAILY REWARD: +100 coins!";
    update();
}

function shop(){

    if(coins<50){
        document.getElementById("message").textContent =
            "🪙 You need 50 coins to buy a speed boost.";
        return;
    }

    coins-=50;

    document.getElementById("message").textContent =
        "⚡ Speed Boost purchased!";

    update();
}

function missions(){

    let progress=score%10;

    document.getElementById("message").textContent =
        "🎯 Mission: Catch 10 squares. Progress: "+
        progress+"/10";
}

function toggleAdmin(){

    const panel=document.getElementById("admin");

    panel.style.display =
        panel.style.display==="block" ? "none" : "block";
}

function unlockAdmin(){

    /*
      IMPORTANT:
      This is only a LOCAL demo panel.
      Do not use a client-side key for real security.
    */

    const key=document.getElementById("adminKey").value;

    if(key==="DYLAN"){
        document.getElementById("adminControls").style.display="block";
        document.getElementById("adminMessage").textContent=
            "✅ Admin unlocked!";
    }else{
        document.getElementById("adminMessage").textContent=
            "❌ Wrong admin key.";
    }
}

function giveCoins(){

    const uid=document.getElementById("targetPlayer").value.trim();
    const amount=Number(document.getElementById("coinAmount").value);

    if(!uid){
        document.getElementById("adminMessage").textContent=
            "⚠️ Enter a player UID.";
        return;
    }

    if(!amount || amount<1){
        document.getElementById("adminMessage").textContent=
            "⚠️ Enter a valid coin amount.";
        return;
    }

    /*
      This demo cannot change another player's real account.
      For Firebase, this button should call a secure server/
      Cloud Function after verifying the admin.
    */

    document.getElementById("adminMessage").textContent=
        "🪙 Request prepared for UID: "+uid+
        " | Amount: "+amount;
}

function addCoinsSelf(){

    coins+=1000;

    document.getElementById("adminMessage").textContent=
        "💰 +1,000 coins added to this browser.";

    update();
}

function resetGame(){

    score=0;
    coins=0;
    level=1;
    lives=3;

    update();
    moveSquare();

    document.getElementById("adminMessage").textContent=
        "🔄 Game reset!";
}

update();
moveSquare();
</script>

</body>
</html>
```
